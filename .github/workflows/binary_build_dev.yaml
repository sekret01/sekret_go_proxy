name: Build bins for dev-branch

on: [ push ] 

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]

    steps:
      - name: Copy project
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -o server-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=amd64 go build -o client-linux-amd64 ./cmd/client

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-amd64
          path: server-linux-amd64

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-linux-amd64
          path: client-linux-amd64
